[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["/src/**", "/migrations/**", "/package.json", "/package-lock.json", "/tsconfig*.json", "/Dockerfile", "/.dockerignore", "/railway.toml"]

[deploy]
numReplicas = 1
sleepApplication = false
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
drainingSeconds = 15
overlapSeconds = 0
